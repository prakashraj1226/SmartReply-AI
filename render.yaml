services:
  # 1. Spring Boot Backend Web Service (Free Tier)
  - type: web
    name: smartreply-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: WHATSAPP_VERIFY_TOKEN
        value: "smartreply_verify_token_secure_2026"
      - key: PORT
        value: "8080"

  # 2. Angular Frontend Static Site (Free Tier)
  - type: web
    name: smartreply-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: ./dist/frontend/browser
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
