server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: smartreply-ai
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartreply_db}
    username: ${SPRING_DATASOURCE_USERNAME:smartreply}
    password: ${SPRING_DATASOURCE_PASSWORD:smartreply_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:80,http://localhost:3000,http://127.0.0.1:4200}
  whatsapp:
    webhook-verify-token: ${WHATSAPP_VERIFY_TOKEN:smartreply_verify_token_secure_2026}
  ai:
    default-provider: ${AI_PROVIDER:MOCK} # MOCK, OPENAI, ANTHROPIC
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
